# Glucose Actions - Configuration
# Copy this file to config.yaml and fill in your values:
#   cp config.example.yaml config.yaml
#   chmod 600 config.yaml

librelinkup:
  # Credentials can also be set via env vars: LIBRELINKUP_EMAIL, LIBRELINKUP_PASSWORD
  email: "your-email@example.com"
  password: "your-password"

alerts:
  low_threshold: 70        # mg/dL - below this triggers low alert
  high_threshold: 180      # mg/dL - above this triggers high alert
  cooldown_minutes: 20     # minutes between repeated alerts for same level
  max_reading_age_minutes: 15  # ignore readings older than this

  # Alert message templates (optional — defaults to Portuguese)
  # Available placeholders: {value} = glucose mg/dL, {trend} = trend arrow,
  # {trend_text} = trend in words (see trend_texts), {level} = low/high
  messages:
    low: "Atencao: glicose em {value} mg/dL {trend} {trend_text}, nivel baixo"
    high: "Atencao: glicose em {value} mg/dL {trend} {trend_text}, nivel alto"
    # English example:
    # low: "Warning: glucose at {value} mg/dL {trend} {trend_text}, level low"
    # high: "Warning: glucose at {value} mg/dL {trend} {trend_text}, level high"

  # Words used for {trend_text} (optional — defaults to Portuguese below).
  # When the sensor reports no trend, {trend} and {trend_text} are left empty.
  # trend_texts:
  #   DOWN_FAST: "caindo rapido"     # English: "falling fast"
  #   DOWN_SLOW: "caindo"            # "falling"
  #   STABLE: "estavel"              # "stable"
  #   UP_SLOW: "subindo"             # "rising"
  #   UP_FAST: "subindo rapido"      # "rising fast"

outputs:
  - type: webhook
    enabled: false
    url: ""                # e.g. https://api-v2.voicemonkey.io/announcement
    token: ""
    device: ""
    language: "pt-BR"      # language for Alexa TTS pronunciation (e.g. pt-BR, en-US, es-ES)

  - type: whatsapp
    enabled: false
    phone_number_id: ""    # from Meta Business Manager > WhatsApp > Phone Numbers
    access_token: ""       # or set WHATSAPP_ACCESS_TOKEN env var (recommended)
    recipient: ""          # recipient phone with country code, e.g. 5511999999999
    template_name: "glucose_alert"  # approved template with one body parameter {{1}}
    language_code: "pt_BR"

# Daily summary sent once a day by a separate cron entry (python -m src.daily_summary), e.g. at 21:00.
# Reports today's time in range and hours that were often high/low in the last days.
daily_summary:
  enabled: false
  goal_percent: 80         # time in range (low_threshold..high_threshold) considered a good day
  pattern_days: 7          # look-back window for recurring high/low hours
  pattern_min_days: 3      # an hour is "recurring" when out of range on at least this many days
  min_readings: 16         # below this many readings today (~4h), time in range is not reported
  outputs: ["webhook"]     # output types that receive the summary (omit to use all enabled outputs)
  # Message templates (optional — defaults to Portuguese). Placeholders: {tir} = today's % in range,
  # {goal}, {low}, {high}, {days}, {hours} = spoken hours (e.g. "por volta das 15h")
  # messages:
  #   good: "Parabéns! Hoje a glicose ficou {tir}% do tempo na faixa ideal. Foi um ótimo dia, continue assim!"
  #   improve_high: "..."   # below goal, mostly above high_threshold
  #   improve_low: "..."    # below goal, mostly below low_threshold
  #   pattern_high: "Nos últimos {days} dias, a glicose costumou subir {hours}. Vale uma atenção especial nesses horários."
  #   pattern_low: "..."
  #   no_data: "..."

logging:
  level: "INFO"            # DEBUG, INFO, WARNING, ERROR
  file: ""                 # empty = stdout only

state_file: "state.json"
history_file: "history.json"   # accumulated readings for the daily summary (kept 14 days)
lock_file: "/tmp/glucose-actions.lock"
